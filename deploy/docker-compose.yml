# Runs the pool daemon. Node services (litecoind, dogecoind) are added in Wave 1
# along with a regtest profile for integration testing.
services:
  alamo:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
    image: alamo-mining-pool:local
    restart: unless-stopped
    ports:
      - "3333:3333"   # stratum
      - "8080:8080"   # dashboard and API
    volumes:
      - ../alamo.toml:/etc/alamo/alamo.toml:ro
      - alamo-data:/var/lib/alamo

volumes:
  alamo-data:
