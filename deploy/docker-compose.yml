# Runs the pool daemon from the published image. The nodes (litecoind, dogecoind) are
# expected to be running already; see docs/OPERATING.md for the node settings and for a
# regtest setup in deploy/regtest.
#
#   cp config/alamo.example.toml alamo.toml   # then edit it
#   docker compose -f deploy/docker-compose.yml up -d
#
# To build the image from source instead of pulling it, replace `image:` with the build
# block below (needs a Rust and Node toolchain inside Docker; takes a while):
#   build:
#     context: ..
#     dockerfile: deploy/docker/Dockerfile
services:
  alamo:
    image: ghcr.io/slongstreet/alamo-mining-pool:latest
    restart: unless-stopped
    # The daemon talks to nodes on the host at the addresses in alamo.toml. On Linux,
    # host networking is the simplest way to reach 127.0.0.1:9332 / 22555 and the ZMQ
    # ports; on Docker Desktop use host.docker.internal in alamo.toml instead.
    network_mode: host
    volumes:
      - ../alamo.toml:/etc/alamo/alamo.toml:ro
      - alamo-data:/var/lib/alamo
    stop_grace_period: 10s

volumes:
  alamo-data:
