manifestVersion: 1
id: longstreet-alamo
category: bitcoin
name: Alamo Mining Pool
version: "0.1.7"
tagline: Solo mine Litecoin and merge-mine Dogecoin against your own nodes
description: >-
  Alamo is a self-hosted solo mining pool. Miners connect over stratum with their
  Litecoin address as the username (and a Dogecoin address as the password) and every
  block found pays that miner directly from the coinbase. The dashboard shows live
  hashrate, workers, shares, blocks found, and the odds of finding the next block.

  Requires the Litecoin and Dogecoin node apps from this store; the pool reads their RPC
  and ZMQ endpoints automatically. Set your fallback payout addresses in
  alamo.toml under the app's data directory before pointing miners at port 3333.
releaseNotes: >-
  Alamo 0.1.5: a reset button for share counts and best share, a fix for the best
  share shown after a restart, and difficulty changes that no longer resend the current
  job, so variable difficulty settles instead of drifting.
developer: Scott Longstreet
website: https://github.com/slongstreet/alamo-mining-pool
icon: https://raw.githubusercontent.com/slongstreet/longstreet-umbrel-apps/refs/heads/main/longstreet-alamo/icon.svg
dependencies:
  - longstreet-litecoin
  - longstreet-dogecoin
repo: https://github.com/slongstreet/alamo-mining-pool
support: https://github.com/slongstreet/alamo-mining-pool/issues
port: 8080
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: Scott Longstreet
submission: https://github.com/slongstreet/alamo-mining-pool
