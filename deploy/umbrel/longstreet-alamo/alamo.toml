# Alamo Mining Pool on Umbrel. Node endpoints and credentials come from the Litecoin and
# Dogecoin node apps through environment variables; the daemon substitutes ${NAME} when it
# reads this file. The two fallback_address values are the only ones to edit here, and the
# dashboard's Settings page can set them too (its values override this file).

[pool]
name = "Alamo Solo Pool"
data_dir = "/var/lib/alamo"

[stratum]
listen = "0.0.0.0:3333"

[stratum.vardiff]
initial_difficulty = 65536
min_difficulty = 1024
max_difficulty = 16777216
target_share_seconds = 10
retarget_seconds = 60
variance_percent = 30

[web]
# Reached only through Umbrel's app proxy.
listen = "0.0.0.0:8080"

[coins.ltc]
enabled = true
rpc_url = "http://${APP_LONGSTREET_LITECOIN_NODE_IP}:${APP_LONGSTREET_LITECOIN_RPC_PORT}"
rpc_user = "${APP_LONGSTREET_LITECOIN_RPC_USER}"
rpc_password = "${APP_LONGSTREET_LITECOIN_RPC_PASS}"
zmq_hashblock = "tcp://${APP_LONGSTREET_LITECOIN_NODE_IP}:${APP_LONGSTREET_LITECOIN_ZMQ_HASHBLOCK_PORT}"
# CHANGE ME: a Litecoin address you control. Paid when a miner's username is not a valid
# Litecoin address.
fallback_address = "ltc1qexampleexampleexampleexampleexampleexamp"
coinbase_tag = "/alamo/"

[coins.doge]
enabled = true
merge_mined_with = "ltc"
rpc_url = "http://${APP_LONGSTREET_DOGECOIN_NODE_IP}:${APP_LONGSTREET_DOGECOIN_RPC_PORT}"
rpc_user = "${APP_LONGSTREET_DOGECOIN_RPC_USER}"
rpc_password = "${APP_LONGSTREET_DOGECOIN_RPC_PASS}"
zmq_hashblock = "tcp://${APP_LONGSTREET_DOGECOIN_NODE_IP}:${APP_LONGSTREET_DOGECOIN_ZMQ_HASHBLOCK_PORT}"
# CHANGE ME: a Dogecoin address you control. Paid when a miner gives no Dogecoin address in
# the stratum password field.
fallback_address = "DExampleExampleExampleExampleExampl"

# Optional: Bitcoin solo mining (SHA-256d) on port 3334, against a bitcoind elsewhere on
# your network (for example the Bitcoin Node app on another Umbrel). It is not configured
# here: Umbrel does not provide that node's address or credentials, and secrets never go
# in the app store. Instead create the local overlay
#   ~/umbrel/app-data/longstreet-alamo/data/alamo.local.toml
# (inside the container: /var/lib/alamo/alamo.local.toml). The daemon merges it over this
# file at startup, it lives in the app's data directory, which app updates never touch,
# and the dashboard's Settings page still overrides both. Put this in it, uncommented,
# with your node's values, run `chmod 600` on it, and restart the app:
#
# [coins.btc]
# enabled = true
# rpc_url = "http://192.168.1.20:8332"
# rpc_user = "umbrel"
# rpc_password = "the node's RPC password"
# # Only if the node's ZMQ hashblock port is reachable from this device; without it the
# # pool polls the node twice a second.
# # zmq_hashblock = "tcp://192.168.1.20:28334"
# # CHANGE ME: a Bitcoin address you control, paid when a miner's username is not one.
# fallback_address = "bc1qexampleexampleexampleexampleexampleexamp"
# coinbase_tag = "/alamo/"
#
# [coins.btc.stratum]
# listen = "0.0.0.0:3334"
