<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a3441f"/>
      <stop offset="1" stop-color="#4a1a0c"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0dcc0"/>
      <stop offset="1" stop-color="#c4a06a"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf3e6"/>
      <stop offset="1" stop-color="#e4d4b4"/>
    </linearGradient>
    <linearGradient id="stone" x1="72" y1="0" x2="184" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7a3e22"/>
      <stop offset="0.45" stop-color="#4a2414"/>
      <stop offset="1" stop-color="#2a1208"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="92" fill="url(#ring)" filter="url(#shadow)"/>
  <circle cx="128" cy="128" r="74" fill="url(#face)"/>
  <circle cx="128" cy="128" r="74" fill="none" stroke="#c4a06a" stroke-opacity="0.35" stroke-width="2"/>

  <g fill="#4a1a0c" opacity="0.35">
    <rect x="126" y="40" width="4" height="10" rx="2" transform="rotate(0 128 128)"/>
    <rect x="126" y="40" width="4" height="10" rx="2" transform="rotate(30 128 128)"/>
    <rect x="126" y="40" width="4" height="10" rx="2" transform="rotate(60 128 128)"/>
    <rect x="126" y="40" width="4" height="10" rx="2" transform="rotate(90 128 128)"/>
    <rect x="126" y="40" width="4" height="10" rx="2" transform="rotate(120 128 128)"/>
    <rect x="126" y="40" width="4" height="10" rx="2" transform="rotate(150 128 128)"/>
    <rect x="126" y="40" width="4" height="10" rx="2" transform="rotate(180 128 128)"/>
    <rect x="126" y="40" width="4" height="10" rx="2" transform="rotate(210 128 128)"/>
    <rect x="126" y="40" width="4" height="10" rx="2" transform="rotate(240 128 128)"/>
    <rect x="126" y="40" width="4" height="10" rx="2" transform="rotate(270 128 128)"/>
    <rect x="126" y="40" width="4" height="10" rx="2" transform="rotate(300 128 128)"/>
    <rect x="126" y="40" width="4" height="10" rx="2" transform="rotate(330 128 128)"/>
  </g>

  <!-- Alamo chapel: campanulate parapet, arched door, two niches -->
  <path fill="url(#stone)" fill-rule="evenodd" d="
    M 72 190 L 72 120 L 72 114
    C 86 114 94 108 102 94
    C 108 82 110 74 114 70
    L 114 66
    C 114 60 118 56 124 56
    L 132 56
    C 138 56 142 60 142 66
    L 142 70
    C 146 74 148 82 154 94
    C 162 108 170 114 184 114
    L 184 120 L 184 190 Z
    M 110 190
    L 110 156
    C 110 144 117 138 128 138
    C 139 138 146 144 146 156
    L 146 190 Z
  "/>
  <!-- left niche: Litecoin silver -->
  <path fill="#c9d4de" d="M 86 168 L 86 154 C 86 148 90 146 94 146 C 98 146 102 148 102 154 L 102 168 Z"/>
  <!-- right niche: Dogecoin gold -->
  <path fill="#e6b94a" d="M 154 168 L 154 154 C 154 148 158 146 162 146 C 166 146 170 148 170 154 L 170 168 Z"/>
</svg>
