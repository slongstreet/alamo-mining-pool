name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check that the Umbrel app pins this release
        run: deploy/umbrel/check-version.sh
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist

  rust:
    name: Rust ${{ matrix.target }}
    needs: dashboard
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross linker (arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Test
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --workspace
      - run: cargo build --release -p alamo --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: alamo-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/alamo

  regtest:
    name: Regtest end-to-end (Litecoin + Dogecoin)
    needs: dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: regtest
      - name: Start litecoind and dogecoind (regtest)
        run: docker compose -f deploy/regtest/docker-compose.yml up -d --build
      - name: Build tests
        run: cargo test -p alamo --test regtest --no-run
      - name: Prepare dogecoind for auxpow
        run: ./deploy/regtest/prepare-dogecoin.sh
      - name: Mine before MWEB activation
        env:
          ALAMO_REGTEST_RPC: http://alamo:alamo@127.0.0.1:19443
          ALAMO_REGTEST_DOGE_RPC: http://alamo:alamo@127.0.0.1:18332
        run: cargo test -p alamo --test regtest -- --nocapture
      - name: Activate MWEB
        run: ./deploy/regtest/activate-mweb.sh
      - name: Mine after MWEB activation
        env:
          ALAMO_REGTEST_RPC: http://alamo:alamo@127.0.0.1:19443
          ALAMO_REGTEST_DOGE_RPC: http://alamo:alamo@127.0.0.1:18332
        run: cargo test -p alamo --test regtest -- --nocapture
      - name: Node logs
        if: failure()
        run: docker compose -f deploy/regtest/docker-compose.yml logs --tail 100
