name: Release

# Tag a commit `vX.Y.Z` (matching the workspace version in Cargo.toml) to publish static
# Linux binaries for x86-64 and arm64, a GitHub release, and a multi-arch image on GHCR.
# `workflow_dispatch` runs the same build without publishing, to test the pipeline.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  dashboard:
    name: Dashboard build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist

  binaries:
    name: Build ${{ matrix.target }}
    needs: dashboard
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            arch: amd64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - name: Check that the tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build
        env:
          # cc-rs builds the bundled SQLite and ring's C sources; point it at musl.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked -p alamo --target ${{ matrix.target }}
      - name: Smoke test
        run: |
          bin=target/${{ matrix.target }}/release/alamo
          file "$bin"
          "$bin" --version
          "$bin" --config config/alamo.example.toml --check
      - name: Package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="alamo-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name" "dist/bin/${{ matrix.arch }}"
          cp target/${{ matrix.target }}/release/alamo "dist/$name/"
          cp target/${{ matrix.target }}/release/alamo "dist/bin/${{ matrix.arch }}/alamo"
          cp config/alamo.example.toml deploy/systemd/alamo.service README.md LICENSE "dist/$name/"
          cp docs/OPERATING.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: alamo-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.arch }}
          path: dist/bin/${{ matrix.arch }}/alamo

  release:
    name: GitHub release
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: alamo-*
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "${GITHUB_REF_NAME}" \
            --title "alamo ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*.tar.gz dist/*.sha256

  docker:
    name: Docker image
    needs: binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: bin-amd64
          path: dist/bin/amd64
      - uses: actions/download-artifact@v8
        with:
          name: bin-arm64
          path: dist/bin/arm64
      - run: chmod +x dist/bin/*/alamo
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
