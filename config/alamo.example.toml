# Alamo Mining Pool example configuration.
# Copy to alamo.toml and edit. Run with: alamo --config alamo.toml

[pool]
name = "Alamo Solo Pool"
# Directory for the SQLite database and other state.
data_dir = "./data"

# Stratum listener and vardiff for every parent coin without its own
# [coins.<key>.stratum] section (see the end of this file).
[stratum]
listen = "0.0.0.0:3333"

[stratum.vardiff]
# Share difficulty a new connection starts at.
initial_difficulty = 65536
min_difficulty = 1024
max_difficulty = 16777216
# Aim for roughly one share every N seconds per worker.
target_share_seconds = 10
# Minimum seconds between difficulty changes. Each change is based on the worker's
# accepted work over the last four of these intervals, and moves at most 2x per step.
retarget_seconds = 60
# Only retarget when the observed interval is off by more than this percentage.
variance_percent = 30

[web]
listen = "0.0.0.0:8080"
# The dashboard's Settings page can change the pool name, coinbase tag, fallback payout
# addresses, vardiff, and log level; changes are stored in the database and override
# this file. The API has no authentication, so if people who should not operate the pool
# can reach the dashboard, make it read-only:
# read_only = true

# Litecoin is the parent chain. Miners connect with an LTC address as username.
[coins.ltc]
enabled = true
rpc_url = "http://127.0.0.1:9332"
rpc_user = "alamo"
# Any value may reference an environment variable as "${NAME}"; the daemon substitutes it
# when the file is read and refuses to start if the variable is unset. Keeps secrets out
# of the file, e.g. rpc_password = "${LTC_RPC_PASSWORD}".
rpc_password = "change-me"
# Optional: instant block notifications from the node's `-zmqpubhashblock` socket.
# Polling continues as a fallback (every 10 s while ZMQ is up).
# zmq_hashblock = "tcp://127.0.0.1:28332"
# How often to check the tip without ZMQ (ms), refresh the template for new fees (s), and
# how long the node may stay unreachable before its template is withdrawn (s).
# poll_interval_ms = 500
# template_refresh_secs = 30
# template_stale_secs = 120
# Paid if a worker's username is not a valid LTC address.
fallback_address = "ltc1qexampleexampleexampleexampleexampleexamp"
# Text placed in the coinbase scriptSig. With merge mining the aux commitment leaves
# room for 41 bytes.
coinbase_tag = "/alamo/"

# Dogecoin is merge-mined against Litecoin.
[coins.doge]
enabled = true
merge_mined_with = "ltc"
rpc_url = "http://127.0.0.1:22555"
rpc_user = "alamo"
rpc_password = "change-me"
# zmq_hashblock = "tcp://127.0.0.1:28333"
# Miners put their DOGE address in the stratum password field, bare ("D...") or tagged
# ("doge=D..."). This address is paid when a worker does not supply one.
fallback_address = "DExampleExampleExampleExampleExampl"

# Each enabled coin without merge_mined_with is a parent with its own lane: its own
# listener, vardiff, statistics, and accounting. Lanes start independently, so one whose
# node is still syncing never keeps another's miners out. A parent uses [stratum] above
# unless it has a section of its own; two parents cannot share a listen address. A
# merge-mined coin has no section: its miners connect to the parent. If the vardiff
# table is present it must name all six fields; without it the built-in defaults apply.
# The dashboard's vardiff overrides for such a lane are stored as
# coins.<key>.stratum.vardiff.<field>.
#
# [coins.<key>.stratum]
# listen = "0.0.0.0:3334"
# [coins.<key>.stratum.vardiff]
# initial_difficulty = 65536
# min_difficulty = 1024
# max_difficulty = 16777216
# target_share_seconds = 10
# retarget_seconds = 60
# variance_percent = 30
